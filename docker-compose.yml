services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: urbanheat, POSTGRES_USER: urbanheat, POSTGRES_PASSWORD: urbanheat }
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/postgres/002_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U urbanheat"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment: { NODE_ENV: production, PORT: 4000, DATABASE_URL: postgresql://urbanheat:urbanheat@postgres:5432/urbanheat, REDIS_URL: redis://redis:6379, CORS_ORIGIN: http://localhost:8080 }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["4000:4000"]
  web:
    build: { context: ., dockerfile: Dockerfile.web, args: { VITE_API_URL: http://localhost:4000/api } }
    depends_on: [api]
    ports: ["8080:80"]
volumes: { postgres_data: {}, redis_data: {} }
